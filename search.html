  <div class="max-w-6xl mx-auto"> <header class="mb-8"> <h1 class="text-4xl md:text-5xl font-bold leading-[1.25] pb-2 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">Search</h1> <p class="text-gray-600 dark:text-gray-400 mt-3">Search blog posts and project content</p> </header> <div class="mb-8"> <input type="text" id="search-input" placeholder="Type to search blog posts and projects..." class="w-full p-4 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"> </div> <div id="search-results" class="space-y-6"> <p class="text-gray-600 dark:text-gray-400">Results will appear here as you type...</p> </div> </div> <script>(function(){const allContent = [{"type":"blog","id":"articles/esp32-s3-networking-mqtt-practice","title":"从 GPIO 到 MQTT：一次 ESP32-S3 网络与 IoT 功能实践","description":"以 ESP32-S3 为核心的完整 IoT 链路实践：GPIO 呼吸灯与触摸、Wi-Fi 配网与 NAPT 转发、设备端 Web 配置入口、自实现 MQTT 客户端，直到 Go 后端订阅温度数据。","tags":["ESP32-S3","IoT","MQTT","嵌入式","Wi-Fi","FreeRTOS"],"content":"## TL;DR (English)\n\nI built a **complete IoT data pipeline** around the ESP32-S3-DevKitC-1 (N16R8): sensor sampling → device networking → on-device web UI → MQTT telemetry → a Go backend service. It is not four separate demos — it is **one combined firmware** running six FreeRTOS tasks across both cores, plus a Go service that subscribes to the device in real time.\n\n```text\nTemperature Sensor ──▶ ESP32-S3 ──▶ MQTT Broker ──▶ Backend Service\n   DHT11 reads temp    collects data & builds MQTT messages   publishes & routes   subscribes & receives\n```\n\nHighlights:\n\n- **Self-implemented protocols**: DHT11 single-bus timing (bit-level read + checksum) and a full MQTT 3.1.1 client on raw `WiFiClient` — no PubSubClient.\n- **NAPT traffic forwarding**: the official SDK lacks NAPT, so I rebuilt the esp32-arduino SDK via `esp32-arduino-lib-builder` to enable `CONFIG_LWIP_NAPT`.\n- **Wi-Fi provisioning**: AP-mode setup page + SmartConfig, with configuration persisted in SPIFFS.\n- **Two-way MQTT**: QoS1 status telemetry (temp/humidity/Wi-Fi/heap) every 10s + a command channel (`led:*`, `ping`, `restart`) for instant control.\n- **Go backend**: layered service — MQTT subscriber, JSONL persistence, web/SSE console, and command publishing.\n\nRepo:\n\n<a href=\"https://github.com/AzureWynn/esp32-s3-networking-lab\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"inline-flex items-center gap-2 no-underline hover:no-underline bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors\">\n<svg class=\"w-4 h-4\" fill=\"currentColor\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"></path></svg>\nesp32-s3-networking-lab\n</a>\n\n以下正文为中文复盘，按「为什么 → 环境 → 逐层实现 → 问题与解决 → 后续计划」展开。\n\n## 1. 为什么开始接触 ESP32-S3\n\n我的日常工作在云端：云商业平台的后端服务，通过 HTTPS API 与 POS、自助终端等设备端系统集成。设备那头的世界对我来说一直是一个「接口之后」的黑盒——串口、GPIO、固件、单总线协议，这些词在接口文档里出现过，但我没有亲手碰过。\n\n参加 MachineCat 黑客松时，机器人硬件是队友带来的现成套件，我负责软件栈，通过它暴露的 HTTP / WebSocket / Bluetooth 接口去驱动。这让我意识到：我擅长接口之上的部分，但对接口之下的部分缺乏第一手体感。\n\n所以这次实验的目的很明确：\n\n1. **补齐设备侧的体感**：亲手做 GPIO、传感器时序、Wi-Fi 配网这些「接口之下」的事；\n2. **验证完整链路**：不是单个点灯 Demo，而是从传感器到后端服务的一条完整数据通路；\n3. **反哺云端工作**：理解设备端的约束（阻塞、内存、时序）之后，再设计设备对接 API 时会更有判断。\n\n我的目标不是转型嵌入式工程师，而是把「IoT 云端服务」这一层经验补上设备侧的另一半视角。\n\n## 2. 开发板和开发环境\n\n### 硬件\n\n| 项目 | 信息 |\n| --- | --- |\n| 开发板 | ESP32-S3-DevKitC-1 |\n| 模组 | ESP32-S3-WROOM-1-N16R8 |\n| 芯片 | ESP32-S3，Xtensa LX7 双核 |\n| Flash / PSRAM | 16 MB Flash + 8 MB OPI PSRAM |\n| USB 转串口 | WCH CH9102 |\n| LED | WS2812（GRB），GPIO48 |\n| 触摸引脚 | GPIO4（TOUCH4） |\n| 温度传感器 | DHT11，数据脚 GPIO15 |\n\n### 软件\n\n| 组件 | 版本/配置 |\n| --- | --- |\n| PlatformIO 平台包 | `espressif32` `3.20017.241212` |\n| Arduino Core | 2.0.17（对应 ESP-IDF 4.4.7） |\n| NAPT SDK | `esp32-arduino-lib-builder`（release/v4.4）本地重编替换 |\n| SDK 构建工具 | Python 3.11 + `xtensa-esp32s3-elf-gcc` 8.4.0 |\n| LED 库 | Adafruit NeoPixel 1.15.5 |\n| Go 服务 | Go 1.25.4，`paho.mqtt.golang` v1.5.1 |\n| MQTT Broker | EMQX（TCP 1883） |\n\n这里有个一开始就踩的版本坑：PlatformIO 平台包版本号 `3.20017.241212` 里开头的 `3` 是 PlatformIO 框架的 major 版本，真正的 Arduino 核心版本是 `20017` = **2.0.17**。这个误读让我先白构建了一份 IDF 5.3 的 SDK（后面细说）。\n\n仓库分三个入口：\n\n- `arduino/`：主组合固件（LED、触摸、DHT11、Wi-Fi、Web、MQTT 同一个程序里运行）\n- `idf/`：独立 ESP-IDF 实验（RMT 驱动 WS2812，更底层的练习）\n- `server/`：Go 后端，通过 MQTT Broker 与设备通信并提供 Web 控制台\n\n## 3. GPIO：呼吸灯和触摸唤醒\n\n这是最外层的「hello world」，但我没有停在点灯。\n\n**WS2812 呼吸灯**：GPIO48 上驱动一颗 WS2812（GRB 时序），做了 `breath / solid / off` 三态状态机——呼吸模式按周期插值亮度，固定色直接设置，熄灭清零。状态切换可以来自网页、MQTT 命令、触摸或串口，全部收敛到同一个状态机，避免多入口互相覆盖。\n\n**电容触摸**：GPIO4（TOUCH4）实现触摸触发 LED 状态切换。自己写了完整检测逻辑：\n\n- **基线校准**：上电时采样若干次取基线，适配不同环境下的电容本底；\n- **阈值判断**：读数偏离基线超过阈值判定为「按下」；\n- **去抖 + 边沿检测**：只有「释放→按下」的下降沿才算一次有效触发，避免长按被识别成连续多次。\n\n**DHT11 温湿度**：这是 GPIO 层最有价值的部分。没有引入第三方 DHT 库，**自己实现了单总线时序**：主机拉低起始信号 → 等待传感器响应 → 逐位读取 40 bit（湿度 16 + 温度 16 + 校验和 8）→ 校验和验证。做的时候对「传感器数据的每一位都是靠微秒级延时数出来的」这件事有了非常具体的体感——这正是云端视角里永远看不到的部分。\n\n## 4. Wi-Fi：扫描、配置和 AP 模式\n\nWi-Fi 层实现了完整的生命周期管理：\n\n- **STA 连接**：配置保存在 SPIFFS 的 `/wifi.json`，重启后自动按已存配置连接；\n- **扫描**：`WiFi.scanNetworks()` 是阻塞操作（1~3 秒），我把它收敛到驱动层：`scanBegin()` 加锁扫描并缓存结果，网页和串口命令都读缓存，阻塞只影响调用方自己的任务；\n- **AP 配网模式**：没有已存配置时自动开启热点 `ESP32-W`，提供 `http://192.168.4.1` 配网页面——扫描列表选网、输密码、保存连接，成功后自动跳到 LED 控制页；\n- **SmartConfig（ESP-Touch）**：配网页、串口命令和 HTTP API 三个入口都能触发，手机 App 广播配网（必须在 2.4G 频段），60 秒超时自动回退 AP 模式。\n\n这个阶段的收获是：**「配网」不是一个功能，而是一套状态机**——已存配置 / 内置回退 / AP 模式 / SmartConfig 进行中，各种状态之间的转换和超时回退比连接本身更费心思。\n\n## 5. NAPT：设备网络转发实践\n\nNAPT 是这个实验最初的动机：让设备接入 Wi-Fi 后，把自己开的 AP 热点下面的下游设备的流量做网络地址转换，转发到上行网络——一个透明代理 / 流量转发节点。\n\n踩的坑也最多，因为**官方 SDK 不带 NAPT**：\n\n1. PlatformIO 自带的 Arduino 核心 2.0.17 对应 ESP-IDF 4.4.7，其预编译 SDK 没有 `CONFIG_LWIP_NAPT`；\n2. 只能用 Espressif 官方的 `esp32-arduino-lib-builder`，在 `release/v4.4` 分支上本地重新编译一份带 NAPT 的 SDK；\n3. 编译时打开 `CONFIG_LWIP_NAPT=y`，产物按 PlatformIO 期望的 `tools/sdk/` 结构替换进去。\n\n最后在板上验证通过：设备 STA 连接上行 Wi-Fi，AP 热点下游设备把设备当网关，流量经 NAPT 转发出去。启动日志里 `[napt] enabled on AP` 就是这条链路活着的证据。\n\n这次「为了一个编译开关重编整个 SDK」的经历，让我对「SDK 里每个能力都是被编译选项裁剪出来的」有了具体的认识——这也解释了为什么不同厂商设备的 API 能力差异那么大。\n\n## 6. Web Server：设备配置入口\n\n设备内置 HTTP 服务（端口 80），同时服务 AP 和局域网两个接口：\n\n| 场景 | 访问 `/` 看到的 |\n| --- | --- |\n| 未连接 Wi-Fi | 配网页（扫描选网 + SmartConfig 入口） |\n| 已连接 | LED 控制页 + Wi-Fi 设置面板（状态/SSID/信号/IP，可改配、清除配置回配网模式） |\n\n主要 API：\n\n```text\nGET  /api/wifi             Wi-Fi 状态（state/ssid/ip/rssi/...）\nPOST /api/wifi             保存配置并连接\nGET  /api/wifi/scan        扫描网络（读驱动缓存）\nPOST /api/wifi/smartconfig 启动 ESP-Touch 监听\nPOST /api/wifi/reset       清除配置，回到 AP 配网模式\nPOST /api/led              LED 控制\n```\n\n作为平时写后端 API 的人，做这个嵌入式 Web 服务最大的不同是**资源约束**：不能随手开连接池、不能无脑加缓存，阻塞操作（扫描、MQTT 读写）必须想清楚跑在哪个任务里、会不会把别的接口饿死。\n\n## 7. MQTT：温度传感器数据上报\n\n这是整个实验的重点：一条从传感器到后端的完整数据链路。\n\n### 7.1 自实现 MQTT 3.1.1 客户端\n\n设备端没有用 PubSubClient，而是**直接基于 `WiFiClient` 实现了 MQTT 3.1.1 协议**：CONNECT / SUBSCRIBE / PUBLISH 报文的组包与解析、QoS0/1、keepalive、断线自动重连。做协议层的目的很功利——想知道「MQTT 客户端库」这层抽象下面到底是什么，以及连接管理、重连退避这些工程细节在资源受限设备上怎么处理。\n\n### 7.2 数据链路\n\n```text\nTemperature Sensor ──▶ ESP32-S3 ──▶ MQTT Broker ──▶ Backend Service\n   DHT11 读取温度       采集并组织 MQTT 消息   发布与接收       订阅并接收温度数据\n```\n\n- **Temperature Sensor**：DHT11 在独立任务里每 2 秒采样一次温湿度并缓存；\n- **ESP32-S3**：每 10 秒把传感器数据 + Wi-Fi 状态 + LED 状态 + 堆内存组织成 JSON，发布到 `esp32/device/status`（QoS1）；LED 状态变化时还会即时上报，不只是周期心跳；\n- **MQTT Broker**：EMQX 监听 1883，负责消息路由；真实地址和凭据不进仓库；\n- **Backend Service**：Go 服务订阅 `esp32/device/status`，把状态与温度数据写 JSONL 落盘，并通过 Web / SSE 实时展示。\n\n上报消息长这样：\n\n```json\n{\"wifi\":\"connected\",\"ssid\":\"<WIFI_SSID>\",\"ip\":\"<DEVICE_IP>\",\"rssi\":-56,\n \"uptime\":110,\"heap\":281384,\"led_mode\":\"solid\",\"led_color\":\"ff0000\",\n \"led_bright\":100,\"led_speed\":1,\"temperature\":26,\"humidity\":60}\n```\n\n### 7.3 命令下发（反向链路）\n\n反向链路同样可用：Go 服务 / `mosquitto_pub` 向 `esp32/device/cmd`（QoS1）发布纯文本命令，设备执行后即时回报状态：\n\n```bash\nmosquitto_pub -h <BROKER_HOST> -t 'esp32/device/cmd' -m 'led:color:00ff00'\nmosquitto_pub -h <BROKER_HOST> -t 'esp32/device/cmd' -m 'ping'   # 设备回 {\"pong\":1}\n```\n\n支持 `led:on/off/color/bright/breath/speed`、`wifi:status`、`ping`、`restart`。这条「云端发指令 → 设备执行 → 状态即时回传」的闭环，和我日常工作里设备对接业务的模型完全同构——只不过这次两端都是我亲手写的。\n\n### 7.4 Go 后端服务\n\n`server/` 按分层结构写：`config` 读 YAML、`infrastructure/mqttclient` 连 Broker、`adapter` 做消息转换、`application` 管状态流、`interfaces/http` 提供 Web 页面和 API。Web 控制台默认 `18081` 端口，可以实时看到设备状态和温度曲线，也能反向下发命令。\n\n### 7.5 组合运行：FreeRTOS 多任务\n\n所有功能不是串在 `loop()` 里的，而是 6 个 FreeRTOS 任务按双核分工：\n\n| 任务 | 核心 | 周期 | 职责 |\n| --- | --- | --- | --- |\n| `wifiTask` | 0 | 10ms | Wi-Fi 驱动、配网轮询、状态事件 |\n| `mqttTask` | 0 | 10ms | MQTT 收发、状态上报、命令处理 |\n| `webTask` | 0 | 5ms | HTTP 请求处理 |\n| `ledTask` | 1 | 20ms | LED 状态机、触摸采样 |\n| `consoleTask` | 1 | 5ms | 串口命令 |\n| `dhtTask` | 1 | 2s | DHT11 采样并缓存 |\n\n任务间通过队列式事件总线解耦：webTask 下发 LED 命令只入队，MQTT 上报由 mqttTask 在自己的上下文完成，避免跨任务 I/O；共享资源（SPIFFS、Wi-Fi 驱动、MQTT 客户端、配网状态）全部加互斥锁，锁顺序固定防止死锁。\n\n代码组织上用了接口注入（`ILedDriver` / `IWifiDriver` / `IMqttClient` / `IFileSystem` / `IConsole`）、Pimpl 隐藏第三方库、工厂统一创建驱动——本质上是把我在后端积累的分层习惯搬到了固件里。\n\n## 8. 遇到的问题和解决过程\n\n完整的踩坑记录在仓库 [doc/04-踩坑记录.md](https://github.com/AzureWynn/esp32-s3-networking-lab/blob/main/doc/04-%E8%B8%A9%E5%9D%91%E8%AE%B0%E5%BD%95.md) 里，挑五个代表性的：\n\n**① 选错 SDK 分支，白构建了一份 IDF 5.3 SDK**\n现象：花大量时间构建出 5.3 的 SDK，但固件根本用不上。\n原因：`espressif32` 平台包号 `3.20017.241212` 开头的 `3` 是 PlatformIO 框架 major 版本，`20017` 才是 Arduino 核心 2.0.17，实际对应 IDF 4.4.7。\n解决：确认版本矩阵后用 `release/v4.4` 分支重新构建。教训：**工具链版本号要先读文档确认语义，不要按直觉猜**。\n\n**② 代理与镜像导致构建环境不可用**\n现象：`git clone` / `curl` / pip 全部卡死，pip 卡在 \"Fetching project description\" 不动。\n原因：本机代理环境变量对 GitHub / dl.espressif / PyPI 不生效；pypi.org 在当前网络不可达。\n解决：构建前 `unset http_proxy https_proxy ...`；pip 换 `PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/`。教训：构建脚本长时间挂起时，**不要用管道看输出**，落盘到日志文件再查。\n\n**③ 大仓库 clone 反复断流**\n现象：esp-idf（>2GB）、arduino-esp32（>1GB）等仓库反复 early EOF。\n解决：浅克隆 `--depth 1 -b <branch>`；固定 commit 用 `git fetch --depth 1 origin <sha>`；实在不行用 codeload tarball 走 HTTP。`esp_wifi/lib`、`esp_phy/lib` 两个 100MB+ 的预编译 blob 子模块是重灾区，手动下载解压绕过。\n\n**④ 官方 SDK 没有 NAPT**\n现象：代码调用 NAPT 相关能力编译不过。\n原因：Arduino Core 2.0.17 配套的预编译 SDK 未开启 `CONFIG_LWIP_NAPT`。\n解决：`esp32-arduino-lib-builder`（release/v4.4）本地重编带 NAPT 的 SDK，按 PlatformIO 期望的产物结构替换。注意 lib-builder 的产物和 pio 官方平台的 builder 脚本不通用，不能整目录乱覆盖。\n\n**⑤ SPIFFS 配置\"改了不生效\"**\n现象：改了 `data/mqtt.json` 的 Broker 地址，设备还是连旧地址。\n原因：配置文件烧在 SPIFFS 分区，只执行编译烧录固件不会更新它。\n解决：改配置后必须 `pio run -t uploadfs`。教训：**分区表里不同区域的数据有不同的更新路径**，这和云端「改配置要区分热更新还是重新部署」是同一类问题。\n\n## 9. 代码仓库和后续计划\n\n完整代码与开发文档：\n\n<a href=\"https://github.com/AzureWynn/esp32-s3-networking-lab\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"inline-flex items-center gap-2 no-underline hover:no-underline bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors\">\n<svg class=\"w-4 h-4\" fill=\"currentColor\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"></path></svg>\nesp32-s3-networking-lab\n</a>\n\n- `arduino/` — 组合固件（本篇主体），`doc/02~08` 是构建、SDK 替换、踩坑、刷写、配网、MQTT、多任务的原始过程记录\n- `idf/` — 独立 ESP-IDF 实验（RMT 驱动 WS2812 + SPIFFS + 串口控制台）\n- `server/` — Go 后端（订阅状态、JSONL 落盘、Web/SSE 展示、命令下发）\n\n仓库里 Wi-Fi、MQTT 凭据与 Broker 地址全部为占位符，截图做了脱敏处理。\n\n**后续计划**（按优先级）：\n\n1. **MQTT over TLS**：目前是 TCP 明文 + 可选凭据，下一步换 8883 端口做证书校验——这正好能复用我做 Webhook 验签时的证书链知识；\n2. **OTA 升级**：固件远程更新，配合 MQTT 命令通道做成「服务端推送版本 → 设备分批升级」的模型；\n3. **传感器扩展**：DHT11 精度有限，换 SHT3x（I²C）对比两种总线协议的实现差异；\n4. **更底层的 IDF 练习**：`idf/` 工程继续深入 RMT、中断、双核调度，而不是停留在 Arduino 封装层；\n5. **云端反哺**：把设备端学到的约束（内存、阻塞、弱网）沉淀成设备对接 API 设计 checklist。\n\n这次实验最直接的价值，是让我在「云后端 ↔ 设备集成」这条自己最熟悉的职业主线上，第一次同时握住了两端。","pubDate":"2026-11-27T00:00:00.000Z"},{"type":"project","id":"ddd-workflows","title":"DDD Discovery & TDD Delivery Workflows","description":"Two self-authored engineering workflow skills: strategic DDD → SDD → BDD requirement discovery, and tactical DDD → spec-to-test → TDD delivery with dependency injection and review gates.","tags":["DDD","TDD","BDD","Methodology","AI Workflow"],"content":"## What they are\n\nTwo reusable, self-authored workflow skills that define how I take a product idea from discovery to delivered code:\n\n1. **DDD Product Discovery** (upstream) — strategic DDD: bounded contexts, ubiquitous language, context mapping → SDD interface specifications → BDD acceptance scenarios → product planning.\n2. **DDD/TDD Expert Team** (downstream) — tactical DDD modeling → specification-to-test derivation → TDD (Red / Green / Refactor) → layered implementation with dependency injection → multi-role review gates.\n\n## Why I built them\n\nAI-assisted coding makes implementation fast — but speed without discipline produces mush. These workflows make the boundaries explicit **before** any code is generated:\n\n- Requirements become bounded contexts and ubiquitous language, not a pile of tickets.\n- Interfaces become specifications; specifications become acceptance scenarios.\n- Scenarios become tests; tests drive implementation through Red / Green / Refactor.\n- Review gates check layering and dependency direction, so AI-generated code lands in the right place with the right seams.\n\n## How I use them\n\nThey are my daily working process, not documentation for show. AI agents accelerate each step — drafting specs, generating tests, implementing against them — while the boundary decisions stay mine. The result is AI-assisted delivery that doesn't sacrifice architectural discipline: fast output, reviewable structure, and tests that exist because the spec demanded them.\n\n## What it demonstrates\n\n- Specification-first engineering habit, applied end-to-end.\n- Ability to design reusable engineering processes — not just write code.\n- A concrete answer to \"how do you keep quality when using AI?\"","pubDate":"2026-10-01T00:00:00.000Z"},{"type":"project","id":"machinecat","title":"MachineCat — AI Robotic Companion","description":"As the sole software developer of a hackathon team, built the complete software stack of an award-winning LLM-driven robotic companion: personality engine, multi-protocol device communication, and a Web3 edition.","tags":["Node.js","Koa","React","DDD","LLM","MQTT","Solana"],"content":"## What it is\n\nMachineCat is an AI-powered robotic companion developed for hackathon competitions. Two versions exist on two branches: a **Web2 hackathon edition** and a **Web3 / OKX hackathon edition**. \n\nMy role: **Independent Software Developer / Software Lead** — every commit in both branches is mine. Teammates covered visual artwork, video production, concept development, and pitching — and brought the robot itself, an off-the-shelf hardware kit. All software — frontend application, backend, deployment, integrations — was designed and implemented by me alone, and the device was driven through the communication interfaces it exposed (HTTP, WebSocket, Bluetooth).\n\n## Web2 edition — core engineering\n\nThe backend is organized with **DDD + hexagonal architecture**, with bounded contexts under the server core:\n\n- `robot-personality` — persona / breed / trait domain\n- `ai-interaction` — LLM prompt building, response parsing, action choreography\n- `robot-control` — robot aggregate plus HTTP / WebSocket / Bluetooth connectors\n- `intimacy` — LLM-based intimacy analysis and persistence\n- `conversation` — conversation tracking and anti-sedentary behavior\n\nKey implementation decisions:\n\n- **Structured LLM output drives a physical device.** The prompt forces the model to return `{text, actions[]}` — actions drive robot movement over HTTP, WebSocket, or Bluetooth connectors. Free-text parsing was never an option when the \"user\" has motors.\n- **LLM as analyzer.** The intimacy system asks the LLM to score each exchange (−3..+3 delta plus per-trait adjustments), clamps and persists results for personality evolution.\n- **Hardware-free development.** A virtual robot simulator speaks the same three protocols, so the whole stack runs locally without a physical device.\n- **Speech input** via audio upload endpoint; JWT + bcrypt authentication.\n\nStack: JavaScript (React 19), Zustand, Node.js, Koa, MongoDB (Mongoose), ws, JWT, bcrypt, winston.\n\n## Web3 edition — integration breadth\n\nBuilt on the same foundation, adds:\n\n- **Solana integration**: on-chain robot state via `@solana/web3.js` + Anchor PDAs (`initialize` / `update_state` / `complete_quest`), with a mock/real fallback so the demo never dies when RPC is down.\n- **Cross-chain payments**: LI.FI quotes, MagicBlock, x402 — again with mock/real switches.\n- **OKX DeFi data** via HMAC-SHA256 signed API requests; OKX / Phantom wallet connection.\n- **Strategy-based authentication**: email, Google OAuth, and Solana wallet-signature auth behind one auth manager.\n- **Device infrastructure**: standalone MQTT broker service + device management API, orchestrated with Docker Compose (MongoDB, Redis, MQTT, Ollama, server, app, nginx) and deployed to Solana Devnet with a live demo on Vercel.\n\n\n## What it demonstrates\n\n- End-to-end independent delivery: design → code → Docker Compose → tunnel → live demo.\n- DDD / hexagonal boundaries applied in a real working project, not a toy example.\n- LLM application engineering: structured output, persona prompts, degradation paths.\n- Integration breadth: Solana, LI.FI, OKX, x402, MQTT, multi-protocol device communication.\n- Honest AI-assisted attribution inside a disciplined process.","pubDate":"2026-05-24T00:00:00.000Z","githubUrl":"https://github.com/AzureWynn/MachineCat"},{"type":"project","id":"experiments/tarot-stars","title":"TarotStars Retrospective · 一个人的第一次路演","description":"A solo developer's first hackathon pitch retrospective (PPT & demo video included). 一个 solo 开发者的 TS 项目复盘——诚实记录踩过的坑与学到的教训。","tags":["个人项目","路演","产品思考"],"content":"## TL;DR (English)\n\nIn July 2025 I pitched **TarotStars** at the IdeaTON Mini hackathon — a solo project for personalized tarot readings on Telegram (TypeScript + React + Telegram Bot). The [Telegram Bot](https://t.me/tarot_stars_bot) and the Mini App were implemented in code, though the Mini App was not publicly accessible due to the lack of a configured deployment domain. The result was humbling: I over-built features, designed only for myself, and treated Web3 like Web2. The retrospective below records what I learned about market research, product usability, and the Web3 mindset — so the next attempt starts smarter.\n\n## 引言\n\n在2025年7月25日，我参加了一个名为 [IdeaTON Mini 黑客松] 的创新项目活动。这是我第一次尝试思考一个完整项目路演。虽然最终结果并不理想，但这段经历让我学到了很多宝贵的经验。今天，我想通过这篇文章分享这一次的故事，记录这次路演的感悟与启发。\n\n## 项目简介\n\n项目名为 [TarotStars]，主要目标是 基于Telegram Mini App，借助 TON 链和 Telegram Stars 支付，为用户提供无缝、私密、可信的个性化塔罗服务平台。\n\n- **目标**：Mini App 无缝集成，Bot 智能交互。\n- **技术栈**：[TypeScript][React][Telegram Bot]\n- **核心功能**：[每日塔罗][AI智能解读]\n\n> 注：以上为路演时的规划目标。「AI 智能解读」当时仅为方案设想，实际实现以文末「后续状态」为准。\n\n\n## 当时的“天真”想法\n\n现在回头看，我当时有几个误区：\n\n1. **以为功能越多越好** → 结果界面很乱\n2. **没考虑别人怎么用** → 只按自己的习惯设计\n3. **觉得“做完就行”** → 没有考虑可用性，后续扩展有难度\n\n## 路演过程\n\n- **PPT 设计**：现在回头看，PPT 过于繁琐，重点不突出。\n\n<iframe \n  src=\"https://docs.google.com/presentation/d/1WCIYCwYlFjlAWf_5_1FNNo2-wS07L_PN/embed?start=false&loop=false&delayms=3000\"\n  width=\"100%\"\n  height=\"560\"\n  frameborder=\"0\"\n  scrolling=\"no\"\n  allowfullscreen=\"true\"\n  mozallowfullscreen=\"true\"\n  webkitallowfullscreen=\"true\"\n  style=\"border: 1px solid #ccc; border-radius: 8px;\"\n></iframe>\n\n<div style=\"height: 3rem;\"></div>\n\n- **路演时刻**：由于紧张，在路演时，没有表现出足够的自信。（如果你有兴趣观看路演视频，可以点击下方，演讲顺序为第一位。）\n\n<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/v__6EhR1cCU?si=FKo38MSOiRRFRhR0\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe>\n\n<div style=\"height: 1rem;\"></div>\n\n尽管如此，这次路演仍然是一次宝贵的经历。\n\n## 收获与反思\n\n这次经历让我意识到：\n\n- **市场调研的重要性**：深入理解用户需求和市场趋势，远比盲目开发更重要。\n\n- **了解得不够深入**：刚刚接触这个行业，对于web3的概念与发展了解得不够深入，只是停留在表面，更多是web2的思维模式，没有考虑到web3的独特之处。\n\n- **持续学习的心态**：每一次失败都是一次成长的机会，不要害怕犯错。\n\n## 后续状态\n\n项目虽未继续推进，但核心部分是真实可验证的：\n\n**Telegram Bot 可体验**：\n\n<a href=\"https://t.me/tarot_stars_bot\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"inline-flex items-center gap-2 no-underline hover:no-underline bg-[#229ED9] hover:bg-[#1f8cbd] text-white px-5 py-2.5 rounded-full text-sm font-semibold transition-colors\">\n<svg class=\"w-4 h-4\" fill=\"currentColor\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.84-.35 1.66.19 1.33 1.55l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z\"></path></svg>\nTelegram Bot · 每日塔罗\n</a>\n\n**Mini App 已完成代码实现**：因当时未配置正式部署域名，未能公开访问，代码见：\n\n<a href=\"https://github.com/AzureWynn/TarotStars\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"inline-flex items-center gap-2 no-underline hover:no-underline bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors\">\n<svg class=\"w-4 h-4\" fill=\"currentColor\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z\"></path></svg>\nTarotStars\n</a>\n\n**AI 智能解读**：停留路演规划阶段，未实现——也是这次「功能堆砌」教训的一部分\n\n**TON / Telegram Stars 支付**：未接入完成\n\n## 结语\n\n感谢阅读，写这篇文章，是想对以前的自己说：\n\n“没关系，笨拙也没关系，重要的是你真的去做了。”\n\n也希望给正在犹豫要不要开始的你一点勇气：\n\n“看，有人和你一样笨拙，但也走完了全程。”","pubDate":"2025-12-31T00:00:00.000Z","githubUrl":"https://github.com/AzureWynn/TarotStars"}];

    // Simple search implementation without external dependencies
    const searchData = allContent.map(item => ({
      id: Math.random().toString(36).substr(2, 9),
      type: item.type,
      id: item.id,
      title: item.title,
      description: item.description,
      tags: item.tags,
      content: item.content,
      pubDate: new Date(item.pubDate),
      rating: item.rating,
      projectUrl: item.projectUrl,
      githubUrl: item.githubUrl
    }));
    
    // Simple fuzzy search function
    function fuzzySearch(query, data) {
      if (!query || query.length < 2) return [];
      
      const queryLower = query.toLowerCase();
      const results = [];
      
      data.forEach(item => {
        let score = 0;
        const title = (item.title || '').toLowerCase();
        const description = (item.description || '').toLowerCase();
        const content = (item.content || '').toLowerCase();
        const tags = (item.tags || []).join(' ').toLowerCase();
        
        // Title matches get highest score
        if (title.includes(queryLower)) score += 10;
        
        // Description matches
        if (description.includes(queryLower)) score += 5;
        
        // Content matches
        if (content.includes(queryLower)) score += 3;
        
        // Tag matches
        if (tags.includes(queryLower)) score += 7;
        
        // Partial matches
        const queryWords = queryLower.split(' ');
        queryWords.forEach(word => {
          if (word.length > 2) {
            if (title.includes(word)) score += 2;
            if (description.includes(word)) score += 1;
            if (content.includes(word)) score += 0.5;
          }
        });
        
        if (score > 0) {
          results.push({ item, score });
        }
      });
      
      // Sort by score (highest first)
      return results.sort((a, b) => b.score - a.score);
    }
    
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value;
      
      if (query.length < 2) {
        searchResults.innerHTML = '<p class="text-gray-600 dark:text-gray-400">Results will appear here as you type...</p>';
        return;
      }
      
      const results = fuzzySearch(query, searchData);
      
      if (results.length === 0) {
        searchResults.innerHTML = '<p class="text-gray-600 dark:text-gray-400">未找到结果，请尝试其他关键词。</p>';
        return;
      }
      
      searchResults.innerHTML = '';
      
      results.forEach(result => {
        const item = result.item;
        const element = document.createElement('div');
        element.className = 'border border-gray-200 dark:border-gray-700 rounded-lg p-6 hover:shadow-lg transition-shadow';
        
        let typeBadge = '';
        if (item.type === 'blog') {
          typeBadge = '<span class="inline-block bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200 text-xs px-2 py-1 rounded mb-2">文章</span>';
        } else {
          typeBadge = '<span class="inline-block bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 text-xs px-2 py-1 rounded mb-2">项目</span>';
        }
        
        let ratingDisplay = '';
        if (item.rating) {
          const stars = '★'.repeat(Math.floor(item.rating)) + '☆'.repeat(5 - Math.floor(item.rating));
          ratingDisplay = `<div class="mt-2">${stars} <span class="ml-1">(${item.rating}/5)</span></div>`;
        }
        
        let links = '';
        if (item.type === 'project') {
          const projectLinks = [];
          if (item.projectUrl) {
            projectLinks.push(`<a href="${item.projectUrl}" target="_blank" rel="noopener noreferrer" class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition-colors mr-2">Visit Project</a>`);
          }
          if (item.githubUrl) {
            projectLinks.push(`<a href="${item.githubUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sm bg-gray-800 text-white px-3 py-1 rounded-lg hover:bg-gray-900 transition-colors"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>GitHub</a>`);
          }
          links = `<div class="mt-3">${projectLinks.join(' ')}</div>`;
        }
        
        element.innerHTML = `
          <div class="flex flex-col">
            <div class="flex-grow">
              ${typeBadge}
              <h3 class="text-xl font-semibold mb-2">
                <a href="${BASE_URL}${item.type === 'blog' ? 'posts' : 'projects'}/${item.id}" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors block">
                  ${item.title}
                </a>
              </h3>
              <p class="text-gray-600 dark:text-gray-400 mb-3">${item.description}</p>
              <div class="flex flex-wrap gap-2 mb-3">
                ${item.tags.map(tag => `<a href="${BASE_URL}tags/${encodeURIComponent(tag)}" class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm px-2.5 py-1 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">${tag}</a>`).join('')}
              </div>
              <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">${new Date(item.pubDate).toLocaleDateString('en-us', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
              ${ratingDisplay}
              ${links}
            </div>
          </div>
        `;
        
        searchResults.appendChild(element);
      });
    });
  })();</script>  </main> <footer class="py-4 border-t border-gray-200 dark:border-gray-700 mt-auto"> <div class="container mx-auto px-4 max-w-6xl text-center text-gray-600 dark:text-gray-400 text-sm"> <p class="mb-2"> <a href="/timeline" class="hover:text-blue-600 dark:hover:text-blue-400">Timeline</a> <span class="mx-2">·</span> <a href="/search" class="hover:text-blue-600 dark:hover:text-blue-400">Search</a> <span class="mx-2">·</span> <a href="/tags" class="hover:text-blue-600 dark:hover:text-blue-400">Tags</a> </p> <p>© 2026 A.W. — Backend Engineer. All rights reserved.</p> </div> </footer> <!-- External links open in new window; internal navigation stays in current tab --> <script type="module">(function(){const d=document.getElementById("theme-toggle"),e=document.getElementById("theme-icon-sun"),t=document.getElementById("theme-icon-moon");(localStorage.getItem("theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark"?(document.documentElement.classList.add("dark"),e.classList.remove("hidden"),t.classList.add("hidden")):(document.documentElement.classList.remove("dark"),e.classList.add("hidden"),t.classList.remove("hidden")),d.addEventListener("click",function(){document.documentElement.classList.contains("dark")?(document.documentElement.classList.remove("dark"),localStorage.setItem("theme","light"),e.classList.add("hidden"),t.classList.remove("hidden")):(document.documentElement.classList.add("dark"),localStorage.setItem("theme","dark"),e.classList.remove("hidden"),t.classList.add("hidden"))})})();</script> <!-- Theme Toggle Script --> <script type="module">document.addEventListener("DOMContentLoaded",()=>{const r=window.location.origin;document.querySelectorAll("a[href]").forEach(t=>{const e=t.getAttribute("href")||"";if(e.startsWith("http://")||e.startsWith("https://"))try{new URL(e).origin!==r&&(t.setAttribute("target","_blank"),t.setAttribute("rel","noopener noreferrer"))}catch{}})});</script> </body> </html>
